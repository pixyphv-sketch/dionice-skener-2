name: Dnevni Skener Dionica

on:
  schedule:
    # Automatski svaki radni dan u 16:30 po našem vremenu
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v3

      - name: Postavi Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instaliraj pakete
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Pokreni skeniranje
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python skener.py
